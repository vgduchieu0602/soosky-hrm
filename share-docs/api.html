<style>
* { box-sizing: border-box; }
#app {
    --card: #ffffff; --text: #1f2937; --muted: #6b7280; --border: #e5e7eb;
    --head: #f8fafc; --chip: #475569; --chipbg: #f1f5f9;
    --status: #b45309; --statusbg: #fef3c7;
    --type: #2563eb; --field: #0f172a;
    --org: #0891b2;
    background: #ffffff; min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: var(--text); line-height: 1.55; font-size: 14px;
}
#app .layout { display: grid; grid-template-columns: 250px 1fr; gap: 28px; align-items: start; max-width: 1024px; margin: 0 auto; }
#app .sidebar { position: sticky; top: 0; max-height: 100vh; overflow-y: auto; padding: 16px 8px 40px; font-size: 13px; }
#app .sb-title { font-weight: 700; font-size: 15px; margin: 0 8px 14px; }
#app .nav-mod { font-weight: 700; font-size: 12px; text-transform: uppercase; letter-spacing: .06em;
    margin: 16px 8px 6px; display: flex; align-items: center; gap: 7px; cursor: pointer; }
#app .nav-mod:hover { opacity: .75; }
#app .dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
#app .nav-sub { display: block; color: var(--muted); font-size: 11px; font-weight: 600; margin: 10px 8px 3px; text-transform: uppercase; letter-spacing: .04em; cursor: pointer; }
#app .nav-sub:hover { color: var(--text); }
#app .nav-uc { display: flex; align-items: center; gap: 7px; padding: 4px 10px; margin: 1px 0; border-radius: 6px; color: var(--muted);
    cursor: pointer; border-left: 2px solid transparent; font-family: ui-monospace, monospace; font-size: 12px; }
#app .nav-uc:hover { background: var(--head); color: var(--text); }
#app .nav-uc.active { color: var(--text); border-left-color: var(--accent); background: var(--head); font-weight: 600; }
#app .nav-m { font-size: 9px; font-weight: 700; letter-spacing: .03em; min-width: 34px; display: inline-block; }
#app [id^="mod-"], #app [id^="sub-"] { scroll-margin-top: 14px; }
#app .content { padding: 16px 4px 80px; min-width: 0; }
#app h1 { font-size: 24px; margin: 0 0 4px; }
#app .lead { color: var(--muted); margin: 0 0 20px; }
#app .callout { background: var(--head); border: 1px solid var(--border); border-radius: 10px; padding: 14px 18px; margin: 0 0 24px; }
#app .callout .label { margin-top: 0; }
#app .callout ul { margin: 4px 0 0; padding-left: 18px; }
#app .callout li { margin: 4px 0; }
#app .roadmap { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
#app .roadmap span { font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--border); }
#app .roadmap .done { background: #ecfeff; color: #0e7490; border-color: #a5f3fc; }
#app .roadmap .todo { background: var(--head); color: var(--muted); }
#app .module { margin-bottom: 12px; }
#app .mod-title { display: inline-block; font-size: 13px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase;
    color: #fff; padding: 5px 14px; border-radius: 999px; margin: 28px 0 6px; }
#app .sub-title { font-size: 17px; font-weight: 700; margin: 22px 0 4px; padding-bottom: 6px; border-bottom: 2px solid var(--border); }
#app .ep { background: var(--card); border: 1px solid var(--border); border-left: 3px solid var(--accent);
    border-radius: 10px; padding: 16px 18px; margin: 14px 0; scroll-margin-top: 12px; }
#app .ep-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
#app .method { color: #fff; font-family: ui-monospace, monospace; font-weight: 700; font-size: 12px;
    padding: 3px 9px; border-radius: 6px; min-width: 64px; text-align: center; display: inline-block; }
#app .m-GET { background: #059669; } #app .m-POST { background: #2563eb; }
#app .m-PATCH { background: #d97706; } #app .m-PUT { background: #4f46e5; } #app .m-DELETE { background: #dc2626; }
#app .path { font-family: ui-monospace, monospace; font-size: 15px; font-weight: 600; color: var(--field); word-break: break-all; }
#app .path .pp { color: #c026d3; font-weight: 700; }
#app .ep-meta { display: flex; gap: 6px; flex-wrap: wrap; margin: 9px 0 2px; }
#app .badge { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 6px; }
#app .badge.bearer { background: #eef2ff; color: #4338ca; }
#app .badge.public { background: #ecfdf5; color: #047857; }
#app .badge.access { background: #f1f5f9; color: #475569; }
#app .badge.uc { background: #fff7ed; color: #c2410c; font-family: ui-monospace, monospace; }
#app .uc-desc { color: var(--muted); margin: 10px 0 4px; }
#app .label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em;
    color: var(--muted); margin: 16px 0 6px; }
#app table { width: 100%; border-collapse: collapse; font-size: 13px; margin-bottom: 4px; table-layout: fixed; }
#app th:nth-child(1), #app td:nth-child(1) { width: 30%; }
#app th:nth-child(2), #app td:nth-child(2) { width: 16%; }
#app th:nth-child(3), #app td:nth-child(3) { width: 54%; }
#app table.errs th:nth-child(1), #app table.errs td:nth-child(1) { width: 12%; }
#app table.errs th:nth-child(2), #app table.errs td:nth-child(2) { width: 34%; }
#app table.errs th:nth-child(3), #app table.errs td:nth-child(3) { width: 54%; }
#app th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted);
    padding: 6px 10px; background: var(--head); border: 1px solid var(--border); }
#app td { padding: 6px 10px; border: 1px solid var(--border); vertical-align: top; }
#app td.f { font-family: ui-monospace, monospace; color: var(--field); white-space: nowrap; }
#app td.t { font-family: ui-monospace, monospace; color: var(--type); white-space: nowrap; }
#app .void { color: var(--muted); font-style: italic; margin: 0; }
#app code.chip { font-family: ui-monospace, monospace; font-size: 12px; background: var(--chipbg); color: var(--chip); padding: 1px 6px; border-radius: 5px; }
#app .status { font-family: ui-monospace, monospace; font-size: 11px; font-weight: 700; background: var(--statusbg); color: var(--status); padding: 1px 6px; border-radius: 5px; }
@media (max-width: 820px) {
    #app .layout { grid-template-columns: 1fr; }
    #app .sidebar { position: static; max-height: none; border-bottom: 1px solid var(--border); }
}
</style>

const MC = { GET:"#059669", POST:"#2563eb", PATCH:"#d97706", PUT:"#4f46e5", DELETE:"#dc2626" };
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const fmt = s => esc(s)
    .replace(/`([^`]+)`/g, '<code class="chip">$1</code>')
    .replace(/\((\d{3}(?:\/\d{3})?)\)/g, '<span class="status">$1</span>');
const fmtPath = p => esc(p).replace(/\{([^}]+)\}/g, '<span class="pp">{$1}</span>');

function tableHtml(rows) {
    let h = '<table><tr><th>Trường</th><th>Kiểu</th><th>Mô tả</th></tr>';
    for (const [f,t,d] of rows) h += `<tr><td class="f">${esc(f)}</td><td class="t">${esc(t)}</td><td>${fmt(d)}</td></tr>`;
    return h + '</table>';
}
function errsHtml(rows) {
    let h = '<div class="label">Lỗi</div><table class="errs"><tr><th>HTTP</th><th>Mã lỗi</th><th>Khi nào</th></tr>';
    for (const [s,c,d] of rows) {
        const st = s === "—" ? '<span class="void">—</span>' : `<span class="status">${esc(s)}</span>`;
        const cd = c === "—" ? '<span class="void">—</span>' : `<span class="chip">${esc(c)}</span>`;
        h += `<tr><td>${st}</td><td>${cd}</td><td>${fmt(d)}</td></tr>`;
    }
    return h + '</table>';
}
function epHtml(ep, accent) {
    let h = `<section class="ep" id="${ep.id}" style="--accent:${accent}">`;
    h += `<div class="ep-head"><span class="method m-${ep.method}">${ep.method}</span><span class="path">${fmtPath(ep.path)}</span></div>`;
    h += `<div class="ep-meta">`;
    h += ep.auth === "Public" ? `<span class="badge public">Public</span>` : `<span class="badge bearer">Bearer</span>`;
    if (ep.access) h += `<span class="badge access">${esc(ep.access)}</span>`;
    h += `<span class="badge uc">${esc(ep.uc)}</span></div>`;
    h += `<p class="uc-desc">${fmt(ep.desc)}</p>`;
    if (ep.params) h += `<div class="label">Path params</div>${tableHtml(ep.params)}`;
    if (ep.query)  h += `<div class="label">Query</div>${tableHtml(ep.query)}`;
    if (ep.body)   h += `<div class="label">Request body</div>${tableHtml(ep.body)}`;
    h += `<div class="label">Response <span class="status">${esc(ep.resp.code)}</span></div>`;
    h += ep.resp.body ? tableHtml(ep.resp.body) : `<p class="void">${fmt(ep.resp.note || "Không có nội dung.")}</p>`;
    h += errsHtml(ep.errors);
    return h + `</section>`;
}

    + '<li>Endpoint gắn nhãn <span class="badge bearer">Bearer</span> yêu cầu header <code class="chip">Authorization: Bearer &lt;accessToken&gt;</code>. Danh tính actor (<code class="chip">actorUserId</code>) lấy <b>từ token</b>, không truyền trong path/body.</li>'
    + '<li>Phân quyền pilot: <b>chỉ cần đã đăng nhập</b> (authenticated-only). RBAC (vai trò HR/admin) để dành cho bản sau.</li>'
    + '<li>Lỗi chung (không lặp ở từng endpoint): <span class="status">401</span> thiếu/không hợp lệ token, <span class="status">400</span> body sai schema (<code class="chip">INVALID_REQUEST</code>), <span class="status">500</span> lỗi máy chủ.</li>'
    + '<li>Thân lỗi: <code class="chip">{ code, message }</code> — cột "Mã lỗi" bên dưới là giá trị <code class="chip">code</code>. Response thành công KHÔNG bọc envelope (trả thẳng DTO / <code class="chip">{ resource: [...] }</code>).</li>'
    + '</ul>'
    + '<div class="label" style="margin-top:14px">Lộ trình module</div>'
    + '<div class="roadmap"><span class="done">organization ✓</span><span class="todo">iam</span><span class="todo">employee</span><span class="todo">attendance</span><span class="todo">payroll</span><span class="todo">performance</span></div>'
    + '<p class="uc-desc" style="margin-top:8px">Các module còn lại sẽ được port theo cùng khuôn và bổ sung vào tài liệu này.</p>'
    + '</div>';

const slug = s => s.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, "");

for (const mod of data) {
    const modId = "mod-" + slug(mod.name);
    nav += `<a class="nav-mod" data-target="${modId}"><span class="dot" style="background:${mod.accent}"></span>${esc(mod.name)}</a>`;
    main += `<div class="module" id="${modId}"><span class="mod-title" style="background:${mod.accent}">${esc(mod.name)}</span>`;
    for (const sub of mod.subs) {
        const subId = "sub-" + slug(sub.name);
        nav += `<a class="nav-sub" data-target="${subId}">${esc(sub.name)}</a>`;
        main += `<div class="sub-title" id="${subId}">${esc(sub.name)}</div>`;
        for (const ep of sub.eps) {
            nav += `<a class="nav-uc" data-target="${ep.id}" style="--accent:${mod.accent}"><span class="nav-m" style="color:${MC[ep.method]}">${ep.method}</span>${esc(ep.uc)}</a>`;
            main += epHtml(ep, mod.accent);
        }
    }
    main += `</div>`;
}

document.getElementById("app").innerHTML =
    `<div class="layout"><aside class="sidebar">${nav}</aside><main class="content">${main}</main></div>`;

document.querySelectorAll("[data-target]").forEach(a => {
    a.addEventListener("click", () => {
        const el = document.getElementById(a.dataset.target);
        if (el) el.scrollIntoView({ behavior: "smooth", block: "start" });
    });
});
const links = new Map([...document.querySelectorAll(".nav-uc")].map(a => [a.dataset.target, a]));
const obs = new IntersectionObserver(entries => {
    entries.forEach(e => {
        if (e.isIntersecting) {
            document.querySelectorAll(".nav-uc.active").forEach(x => x.classList.remove("active"));
            const link = links.get(e.target.id);
            if (link) link.classList.add("active");
        }
    });
}, { rootMargin: "0px 0px -75% 0px", threshold: 0 });
document.querySelectorAll(".ep[id]").forEach(s => obs.observe(s));
</script>
