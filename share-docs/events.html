<style>
* { box-sizing: border-box; }
#app {
    --card: #ffffff; --text: #1f2937; --muted: #6b7280; --border: #e5e7eb;
    --head: #f8fafc; --chip: #475569; --chipbg: #f1f5f9;
    --status: #b45309; --statusbg: #fef3c7;
    --type: #2563eb; --field: #0f172a;
    --org: #0891b2;
    background: #ffffff; min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: var(--text); line-height: 1.55; font-size: 14px;
}
#app .layout { display: grid; grid-template-columns: 250px 1fr; gap: 28px; align-items: start; max-width: 1024px; margin: 0 auto; }
#app .sidebar { position: sticky; top: 0; max-height: 100vh; overflow-y: auto; padding: 16px 8px 40px; font-size: 13px; }
#app .sb-title { font-weight: 700; font-size: 15px; margin: 0 8px 14px; }
#app .nav-mod { font-weight: 700; font-size: 12px; text-transform: uppercase; letter-spacing: .06em;
    margin: 16px 8px 6px; display: flex; align-items: center; gap: 7px; cursor: pointer; }
#app .nav-mod:hover { opacity: .75; }
#app .dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
#app .nav-sub { display: block; color: var(--muted); font-size: 11px; font-weight: 600; margin: 10px 8px 3px; text-transform: uppercase; letter-spacing: .04em; cursor: pointer; }
#app .nav-sub:hover { color: var(--text); }
#app .nav-uc { display: block; padding: 4px 10px; margin: 1px 0; border-radius: 6px; color: var(--muted);
    cursor: pointer; border-left: 2px solid transparent; font-family: ui-monospace, monospace; font-size: 12px; word-break: break-all; }
#app .nav-uc:hover { background: var(--head); color: var(--text); }
#app .nav-uc.active { color: var(--text); border-left-color: var(--accent); background: var(--head); font-weight: 600; }
#app [id^="mod-"], #app [id^="sub-"] { scroll-margin-top: 14px; }
#app .content { padding: 16px 4px 80px; min-width: 0; }
#app h1 { font-size: 24px; margin: 0 0 4px; }
#app .lead { color: var(--muted); margin: 0 0 20px; }
#app .callout { background: var(--head); border: 1px solid var(--border); border-radius: 10px; padding: 14px 18px; margin: 0 0 24px; }
#app .callout .label { margin-top: 0; }
#app .callout ul { margin: 4px 0 0; padding-left: 18px; }
#app .callout li { margin: 4px 0; }
#app .module { margin-bottom: 12px; }
#app .mod-title { display: inline-block; font-size: 13px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase;
    color: #fff; padding: 5px 14px; border-radius: 999px; margin: 28px 0 6px; }
#app .sub-title { font-size: 17px; font-weight: 700; margin: 22px 0 4px; padding-bottom: 6px; border-bottom: 2px solid var(--border); }
#app .ev { background: var(--card); border: 1px solid var(--border); border-left: 3px solid var(--accent);
    border-radius: 10px; padding: 16px 18px; margin: 14px 0; scroll-margin-top: 12px; }
#app .ev-title { font-family: ui-monospace, monospace; font-size: 16px; font-weight: 700; margin: 0 0 8px; color: var(--field); word-break: break-all; }
#app .ev-meta { display: flex; gap: 6px; flex-wrap: wrap; margin: 0 0 2px; }
#app .badge { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 6px; }
#app .badge.integration { background: #eff6ff; color: #1d4ed8; }
#app .badge.domain { background: #f1f5f9; color: #475569; }
#app .badge.planned { background: #fef3c7; color: #b45309; }
#app .badge.delivery { background: var(--statusbg); color: var(--status); }
#app .ev-desc { color: var(--muted); margin: 10px 0 4px; }
#app .label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em;
    color: var(--muted); margin: 16px 0 6px; }
#app table { width: 100%; border-collapse: collapse; font-size: 13px; margin-bottom: 4px; table-layout: fixed; }
#app th:nth-child(1), #app td:nth-child(1) { width: 30%; }
#app th:nth-child(2), #app td:nth-child(2) { width: 22%; }
#app th:nth-child(3), #app td:nth-child(3) { width: 48%; }
#app th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted);
    padding: 6px 10px; background: var(--head); border: 1px solid var(--border); }
#app td { padding: 6px 10px; border: 1px solid var(--border); vertical-align: top; }
#app td.f { font-family: ui-monospace, monospace; color: var(--field); white-space: nowrap; }
#app td.t { font-family: ui-monospace, monospace; color: var(--type); white-space: nowrap; }
#app p.src { margin: 4px 0; }
#app ul.flow { margin: 4px 0; padding-left: 18px; list-style: none; }
#app ul.flow li { margin: 5px 0; position: relative; padding-left: 18px; }
#app ul.flow li::before { content: "→"; position: absolute; left: 0; color: var(--org); font-weight: 700; }
#app .void { color: var(--muted); font-style: italic; margin: 4px 0; }
#app code.chip { font-family: ui-monospace, monospace; font-size: 12px; background: var(--chipbg); color: var(--chip); padding: 1px 6px; border-radius: 5px; }
@media (max-width: 820px) {
    #app .layout { grid-template-columns: 1fr; }
    #app .sidebar { position: static; max-height: none; border-bottom: 1px solid var(--border); }
}
</style>

const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const fmt = s => esc(s)
    .replace(/`([^`]+)`/g, '<code class="chip">$1</code>')
    .replace(/\((\d{3}(?:\/\d{3})?)\)/g, '<span class="status">$1</span>');

function tableHtml(rows) {
    let h = '<table><tr><th>Trường</th><th>Kiểu</th><th>Mô tả</th></tr>';
    for (const [f,t,d] of rows) h += `<tr><td class="f">${esc(f)}</td><td class="t">${esc(t)}</td><td>${fmt(d)}</td></tr>`;
    return h + '</table>';
}
function evHtml(ev, accent) {
    let h = `<section class="ev" id="${ev.id}" style="--accent:${accent}">`;
    h += `<div class="ev-title">${esc(ev.type)}</div>`;
    h += `<div class="ev-meta">`;
    h += ev.layer === "integration"
        ? `<span class="badge integration">Integration event</span><span class="badge delivery">at-least-once</span>`
        : ev.layer === "planned"
        ? `<span class="badge planned">Dự kiến (chưa có ở pilot)</span>`
        : `<span class="badge domain">Domain change</span>`;
    h += `</div>`;
    h += `<p class="ev-desc">${fmt(ev.desc)}</p>`;
    h += `<div class="label">Payload</div>${tableHtml(ev.payload)}`;
    h += `<div class="label">Nguồn phát</div><p class="src">${fmt(ev.producer)}</p>`;
    h += `<div class="label">Người nhận</div>`;
    if (ev.consumers) h += `<ul class="flow">${ev.consumers.map(([n,e])=>`<li><b>${fmt(n)}</b> — ${fmt(e)}</li>`).join("")}</ul>`;
    else h += `<p class="void">${fmt(ev.consumersNote)}</p>`;
    return h + `</section>`;
}

let nav = '<div class="sb-title">HRM · Events Catalog</div>';
let main = '<h1>Events Catalog</h1><p class="lead">Sự kiện của Soosky HRM: integration event (liên module, qua EventBus/outbox) và domain change (nội bộ aggregate). Module <b>Organization</b> ở pilot CHƯA phát/nhận event nào — phần dưới liệt kê các <b>seam dự kiến</b> để tham chiếu khi port các module sau.</p>';
main += '<div class="callout"><div class="label">Quy ước chung</div><ul>'
    + '<li>Mọi event tuân theo envelope <code class="chip">DomainEvent { type, occurredAt, payload }</code>; bảng "Payload" bên dưới liệt kê nội dung của <code class="chip">payload</code>.</li>'
    + '<li><b>Integration event</b> đi qua <code class="chip">EventBus</code> theo mẫu <b>outbox</b> — ghi cùng transaction nghiệp vụ rồi relay đẩy lên bus. Giao nhận <b>at-least-once</b> ⇒ handler phải <b>idempotent</b> (khoá theo `id`).</li>'
    + '<li><b>Liên-module CHỈ qua EventBus</b> — không import trực tiếp giữa các module. Hợp đồng event được module tiêu thụ khai báo lại cục bộ ("published language").</li>'
    + '<li><b>Payload tối giản</b>: chỉ mang định danh ổn định (`departmentId`, `employeeId`). Trường khả biến consumer chủ động đọc lại từ module nguồn.</li>'
    + '<li>Đặt tên integration event: <code class="chip">&lt;module&gt;.&lt;aggregate&gt;.&lt;verb quá khứ&gt;</code> (vd <code class="chip">organization.department.archived</code>).</li>'
    + '</ul></div>';

const slug = s => s.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, "");

for (const mod of data) {
    const modId = "mod-" + slug(mod.name);
    nav += `<a class="nav-mod" data-target="${modId}"><span class="dot" style="background:${mod.accent}"></span>${esc(mod.name)}</a>`;
    main += `<div class="module" id="${modId}"><span class="mod-title" style="background:${mod.accent}">${esc(mod.name)}</span>`;
    for (const g of mod.groups) {
        const subId = "sub-" + slug(mod.name + "-" + g.name);
        nav += `<a class="nav-sub" data-target="${subId}">${esc(g.name)}</a>`;
        main += `<div class="sub-title" id="${subId}">${esc(g.name)}</div>`;
        for (const ev of g.events) {
            nav += `<a class="nav-uc" data-target="${ev.id}" style="--accent:${mod.accent}">${esc(ev.short || ev.type)}</a>`;
            main += evHtml(ev, mod.accent);
        }
    }
    main += `</div>`;
}

document.getElementById("app").innerHTML =
    `<div class="layout"><aside class="sidebar">${nav}</aside><main class="content">${main}</main></div>`;

document.querySelectorAll("[data-target]").forEach(a => {
    a.addEventListener("click", () => {
        const el = document.getElementById(a.dataset.target);
        if (el) el.scrollIntoView({ behavior: "smooth", block: "start" });
    });
});
const links = new Map([...document.querySelectorAll(".nav-uc")].map(a => [a.dataset.target, a]));
const obs = new IntersectionObserver(entries => {
    entries.forEach(e => {
        if (e.isIntersecting) {
            document.querySelectorAll(".nav-uc.active").forEach(x => x.classList.remove("active"));
            const link = links.get(e.target.id);
            if (link) link.classList.add("active");
        }
    });
}, { rootMargin: "0px 0px -75% 0px", threshold: 0 });
document.querySelectorAll(".ev[id]").forEach(s => obs.observe(s));
</script>
