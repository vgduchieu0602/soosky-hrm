# =============================================================================
# infra/docker-compose.yml — Caddy reverse proxy DÙNG CHUNG cho cả VPS
# -----------------------------------------------------------------------------
# TƯ TƯỞNG:
#
#   Đây là "cửa ngõ" duy nhất của toàn VPS. Cài MỘT LẦN, dùng cho TẤT CẢ dự án.
#   Đặt file này ở ~/infra trên VPS (TÁCH KHỎI các repo dự án).
#
#   Caddy này dùng image "caddy-docker-proxy": nó tự đọc nhãn (label) của các
#   container trên mạng "web" để biết domain nào trỏ về container nào — bạn KHÔNG
#   phải sửa file cấu hình tập trung mỗi lần thêm dự án. Mỗi dự án tự khai báo
#   domain của mình bằng label trong docker-compose của nó.
#
#   Caddy cũng tự xin & gia hạn chứng chỉ SSL (Let's Encrypt) cho mọi domain.
#
# CÀI ĐẶT (chạy 1 lần trên VPS):
#   1. Tạo mạng chung:   docker network create web
#   2. mkdir -p ~/infra && cd ~/infra
#   3. Copy file này vào ~/infra/docker-compose.yml
#   4. docker compose up -d
# =============================================================================
name: infra

services:
  caddy:
    image: lucaslorentz/caddy-docker-proxy:2.9-alpine
    restart: unless-stopped
    ports:
      - "80:80"      # cổng web duy nhất mở ra Internet của cả VPS
      - "443:443"    # HTTPS
    environment:
      # Chỉ quét nhãn của container nằm trên mạng "web" -> bỏ qua mạng nội bộ dự án.
      CADDY_INGRESS_NETWORKS: web
    networks:
      - web
    volumes:
      # Cho Caddy đọc docker socket (chỉ đọc) để phát hiện container + nhãn.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Lưu chứng chỉ SSL -> không phải xin lại mỗi lần restart.
      - caddy_data:/data
      - caddy_config:/config

networks:
  # Mạng dùng chung. "external: true" -> đã tạo sẵn bằng "docker network create web".
  web:
    external: true

volumes:
  caddy_data:
  caddy_config:
