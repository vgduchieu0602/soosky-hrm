# =============================================================================
# docker-compose.yml — Soosky HRM (BASE, dùng chung cho mọi môi trường)
# -----------------------------------------------------------------------------
# TƯ TƯỞNG:
#
#        Internet
#           │
#           ▼  (một trong hai overlay bên dưới quyết định cổng vào)
#      ┌──────────┐  /api/v1  ┌──────────┐         ┌──────────┐
#      │ frontend │ ────────► │ backend  │ ──────► │ mongodb  │
#      │  (nginx) │  proxy    │ (node)   │ driver  │ (replSet)│
#      └──────────┘           └──────────┘         └──────────┘
#        public                internal             internal
#                                                        ▲
#                                                 ┌──────────────┐
#                                                 │ mongo-backup │ mongodump + S3
#                                                 └──────────────┘
#
#   File này CỐ TÌNH không publish cổng nào. Chọn đúng MỘT overlay:
#
#     docker-compose.expose.yml   mở thẳng cổng ${WEB_PORT} trên VPS (http://IP:port)
#                                 → dùng khi chưa có tên miền.
#     docker-compose.https.yml    gắn nhãn cho Caddy (infra/docker-compose.yml)
#                                 → HTTPS thật, chứng chỉ Let's Encrypt tự động.
#
#   Không gõ tay `-f` mỗi lần: mỗi file .env khai báo sẵn biến COMPOSE_FILE,
#   docker compose tự đọc (xem .env.production.example / .env.staging.example).
#
#   NHIỀU MÔI TRƯỜNG TRÊN CÙNG MỘT VPS: đặt STACK_NAME khác nhau
#   (hrm-prod / hrm-staging). Mọi network + volume mang tiền tố đó nên hai
#   stack KHÔNG dùng chung database, không giẫm lên nhau.
#
#   BẢO MẬT: backend + mongodb không có `ports:` → chỉ sống trong mạng nội bộ
#   của stack, Internet không gọi thẳng vào API/DB được.
# =============================================================================
name: ${STACK_NAME:-hrm}

services:
  # ---------------------------------------------------------------------------
  # MongoDB — replica set 1 node. App dùng transaction (MongoUnitOfWork) nên
  # replica set là BẮT BUỘC, không phải tuỳ chọn: mongod đơn lẻ sẽ lỗi ngay ở
  # lệnh ghi đầu tiên có transaction.
  #
  # Replica set được khởi tạo bởi service `mongo-init` chạy một lần rồi thoát —
  # tách khỏi healthcheck để healthcheck chỉ làm đúng việc của nó (báo sống hay
  # chết), còn khởi tạo là bước có thứ tự, thấy được trong `docker compose ps`.
  # ---------------------------------------------------------------------------
  mongodb:
    image: mongo:7
    restart: unless-stopped
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - mongo_data:/data/db          # dữ liệu còn nguyên khi build/restart lại
    networks:
      - hrm-net
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok' | grep -q 1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 20s

  # ---------------------------------------------------------------------------
  # Khởi tạo replica set — chạy MỘT LẦN rồi thoát (restart: "no").
  # Idempotent: rs đã khởi tạo thì `rs.status().ok` trả 1 và script không làm gì.
  # ---------------------------------------------------------------------------
  mongo-init:
    image: mongo:7
    restart: "no"
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - hrm-net
    entrypoint:
      - bash
      - -c
      - |
        set -e
        if mongosh --host mongodb --quiet --eval 'rs.status().ok' 2>/dev/null | grep -q 1; then
          echo "Replica set rs0 da san sang."
        else
          echo "Khoi tao replica set rs0..."
          mongosh --host mongodb --quiet --eval \
            "rs.initiate({_id:'rs0',members:[{_id:0,host:'mongodb:27017'}]})"
          # Chờ node trở thành PRIMARY, nếu không backend sẽ khởi động và ghi lỗi.
          mongosh --host mongodb --quiet --eval \
            "let i=0; while(!db.hello().isWritablePrimary && i++<60){ sleep(1000) }; db.hello().isWritablePrimary"
        fi

  # ---------------------------------------------------------------------------
  # Backend — Express API. Chỉ ở mạng nội bộ, không lộ cổng ra ngoài.
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
      mongo-init:
        condition: service_completed_successfully   # có replica set rồi mới khởi động API
    environment:
      NODE_ENV: production
      # Nhãn môi trường để phân biệt log/mail giữa production và staging.
      APP_ENV: ${APP_ENV:-production}
      HTTP_HOST: 0.0.0.0
      HTTP_PORT: 3000
      HTTP_CORS_ORIGINS: ${HTTP_CORS_ORIGINS:-}
      MONGODB_URI: mongodb://mongodb:27017/${MONGODB_DB:-soosky-hrm}?replicaSet=rs0
      MONGODB_DB: ${MONGODB_DB:-soosky-hrm}
      AUTH_JWT_SECRET: "${AUTH_JWT_SECRET:?AUTH_JWT_SECRET la bat buoc - sinh bang openssl rand -hex 32}"
      AUTH_ACCOUNT_VERIFICATION_BASE_URL: ${AUTH_ACCOUNT_VERIFICATION_BASE_URL:-}
      MAIL_FROM: "${MAIL_FROM:?MAIL_FROM la bat buoc}"
      # NODE_ENV=production nên backend TỪ CHỐI khởi động nếu thiếu SMTP_HOST —
      # cố ý: production mà email chỉ ghi log thì người dùng không nhận được
      # thư mời/đặt lại mật khẩu mà không ai biết.
      SMTP_HOST: "${SMTP_HOST:?SMTP_HOST la bat buoc o production/staging}"
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
    networks:
      - hrm-net
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ---------------------------------------------------------------------------
  # Frontend — Nginx phục vụ React + proxy /api/v1 sang backend.
  # Đây là CỬA NGÕ duy nhất; overlay quyết định nó lộ ra ngoài kiểu gì.
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Đường dẫn TƯƠNG ĐỐI -> trình duyệt gọi cùng origin -> nginx proxy về
        # backend. Phải KHỚP prefix backend mount (API_PREFIX trong
        # createExpressServer.ts) và block `location /api/v1/` trong nginx.conf.
        VITE_API_BASE_URL: /api/v1
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - hrm-net

  # ---------------------------------------------------------------------------
  # Backup MongoDB — mongodump theo lịch, giữ bản local + đẩy lên S3/Backblaze.
  # Xem infra/backup/backup.sh. Tắt bằng cách đặt BACKUP_ENABLED=false.
  # ---------------------------------------------------------------------------
  mongo-backup:
    build:
      context: ./infra/backup
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      BACKUP_ENABLED:        ${BACKUP_ENABLED:-true}
      BACKUP_AT_HOUR:        ${BACKUP_AT_HOUR:-2}       # giờ chạy hằng ngày (UTC)
      BACKUP_KEEP_DAYS:      ${BACKUP_KEEP_DAYS:-7}     # số bản giữ trên đĩa VPS
      STACK_NAME:            ${STACK_NAME:-hrm}
      MONGODB_URI:           mongodb://mongodb:27017/?replicaSet=rs0
      MONGODB_DB:            ${MONGODB_DB:-soosky-hrm}
      # Để trống S3_BUCKET → chỉ backup local, không đẩy lên đâu cả.
      S3_BUCKET:             ${S3_BUCKET:-}
      S3_ENDPOINT:           ${S3_ENDPOINT:-}
      S3_REGION:             ${S3_REGION:-}
      AWS_ACCESS_KEY_ID:     ${S3_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
    volumes:
      - mongo_backups:/backups
    networks:
      - hrm-net

networks:
  hrm-net:
    driver: bridge

volumes:
  mongo_data:
  mongo_backups:
