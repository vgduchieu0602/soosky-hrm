# =============================================================================
# docker-compose.yml — Soosky HRM
# Bộ Docker TỰ CHỨA: chạy được ngay bằng "docker compose up -d --build".
# -----------------------------------------------------------------------------
# TƯ TƯỞNG:
#
#   3 container ghép thành 1 hệ thống:
#
#        Internet
#           │  cổng ${WEB_PORT} (mặc định 80)
#           ▼
#      ┌──────────┐   /api    ┌──────────┐         ┌──────────┐
#      │ frontend │ ────────► │ backend  │ ──────► │ mongodb  │
#      │  (nginx) │  proxy    │ (node)   │ mongoose│ (replSet)│
#      └──────────┘           └──────────┘         └──────────┘
#        public                internal             internal
#
#   BẢO MẬT: chỉ frontend mở cổng ra ngoài. backend + mongodb chỉ sống trong
#   mạng nội bộ "hrm-net" -> Internet không gọi thẳng vào API/DB được.
#
#   NHIỀU DỰ ÁN TRÊN 1 VPS (không cần tên miền):
#   mỗi dự án đặt WEB_PORT khác nhau trong .env -> truy cập http://IP:port.
#     HRM   -> WEB_PORT=80     -> http://<IP>
#     DA2   -> WEB_PORT=8081   -> http://<IP>:8081
#     DA3   -> WEB_PORT=8082   -> http://<IP>:8082 ...
#   (Khi nào có tên miền + HTTPS, xem phần Caddy trong DEPLOY-DOCKER.md.)
#
#   "name: hrm" -> network/volume được gắn tiền tố "hrm_", không đụng dự án khác.
# =============================================================================
name: hrm

services:
  # ---------------------------------------------------------------------------
  # MongoDB — replica set 1 node (app dùng transactions nên BẮT BUỘC replSet).
  # Image chính chủ mongo:7. Không mật khẩu nhưng đóng kín mạng nội bộ (không
  # "ports:") -> chỉ backend cùng dự án với tới được. Replica set tự khởi tạo
  # qua healthcheck ở lần chạy đầu, không cần thao tác tay.
  # ---------------------------------------------------------------------------
  mongodb:
    image: mongo:7
    restart: unless-stopped
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - mongo_data:/data/db          # dữ liệu còn nguyên khi build/restart lại
    networks:
      - hrm-net
    healthcheck:
      test:
        - "CMD-SHELL"
        - >
          mongosh --quiet --eval
          "try { rs.status().ok } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongodb:27017'}]}).ok }"
          | grep -q 1
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 20s

  # ---------------------------------------------------------------------------
  # Backend — Express API. Chỉ ở mạng nội bộ, không lộ cổng ra ngoài.
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy   # chờ Mongo sẵn sàng rồi mới khởi động API
    environment:
      NODE_ENV: production
      PORT: 3000
      MONGO_URI: mongodb://mongodb:27017/${MONGO_DB_NAME}?replicaSet=rs0
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL}
      BCRYPT_ROUND: ${BCRYPT_ROUND}
      APP_WEB_URL: ${APP_WEB_URL}
      MAIL_FROM: ${MAIL_FROM}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_REGION: ${S3_REGION}
      S3_BUCKET: ${S3_BUCKET}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_PRESIGN_TTL: ${S3_PRESIGN_TTL}
    networks:
      - hrm-net
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ---------------------------------------------------------------------------
  # Frontend — Nginx phục vụ React + proxy /api sang backend.
  # Đây là CỬA NGÕ duy nhất lộ ra ngoài, qua cổng ${WEB_PORT}.
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api/v1   # đường dẫn tương đối -> nginx proxy về backend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      # "${WEB_PORT:-80}" = lấy WEB_PORT trong .env, không có thì mặc định 80.
      # Trái = cổng trên VPS, phải = cổng 80 bên trong nginx.
      - "${WEB_PORT:-80}:80"
    networks:
      - hrm-net

networks:
  hrm-net:
    driver: bridge

volumes:
  mongo_data:
