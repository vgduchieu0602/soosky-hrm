# =============================================================================
# Nginx config — phục vụ SPA + reverse proxy API
# -----------------------------------------------------------------------------
# Container này làm 2 việc:
#   1. Trả file tĩnh của React (index.html, JS, CSS).
#   2. Làm "người trung gian": mọi request bắt đầu bằng /api sẽ được chuyển tiếp
#      (proxy) sang container backend. Nhờ vậy trình duyệt chỉ nói chuyện với 1
#      địa chỉ duy nhất -> không vướng CORS, cookie chạy ngon.
# =============================================================================

server {
  listen 80;
  server_name _;   # "_" = khớp mọi tên miền trỏ tới VPS này.

  # Nén gzip cho text/js/css -> tải nhanh hơn cho người dùng.
  gzip on;
  gzip_types text/plain text/css application/json application/javascript application/xml;
  gzip_min_length 1024;

  # --- (1) Reverse proxy: /api/v1/... -> backend container ------------------
  # "backend" là TÊN SERVICE trong docker-compose. Docker có DNS nội bộ nên
  # nginx phân giải "backend" thành IP của container API. Cổng 3000 = PORT của API.
  #
  # QUAN TRỌNG: backend mount router dưới đúng prefix "/api/v1" (xem
  # backend/src/infra/server/createExpressServer.ts — hằng API_PREFIX), nên
  # proxy_pass GIỮ NGUYÊN prefix, không cắt. Cắt prefix ở đây = 404 toàn bộ API.
  #
  # Đặt block /api/v1 TRƯỚC block "/" để nó được ưu tiên khớp.
  location /api/v1/ {
    proxy_pass http://backend:3000/api/v1/;

    # Chuyển tiếp thông tin gốc của client để backend log/đọc cho đúng.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Cho phép upload file lớn (vd CV, tài liệu nhân sự) — chỉnh theo nhu cầu.
    client_max_body_size 25m;
  }

  # --- (2) SPA fallback ------------------------------------------------------
  # React Router xử lý route phía client. Khi user F5 ở /employees/123, Nginx
  # KHÔNG có file đó trên đĩa -> try_files sẽ trả về index.html để React tự
  # render đúng route. Thiếu dòng này = F5 ra trang 404.
  location / {
    root /usr/share/nginx/html;
    index index.html;
    try_files $uri $uri/ /index.html;
  }

  # Cache mạnh cho asset có hash trong tên (Vite tự thêm hash) -> an toàn cache lâu.
  location /assets/ {
    root /usr/share/nginx/html;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
