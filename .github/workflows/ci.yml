# =============================================================================
# CI — cổng chất lượng bắt buộc trước khi merge vào master.
# -----------------------------------------------------------------------------
# 4 job chạy SONG SONG (trừ integration cần Mongo):
#   backend-check      typecheck (src + tests) → unit test → build
#   backend-integration  smoke test vòng đời HR trên MongoDB replica set thật
#   frontend-check     lint → typecheck → unit test → build production
#   docker-build       build đúng 2 image sẽ deploy (bắt lỗi Dockerfile sớm)
#
# CHẶN MERGE: bật branch protection cho `master` và đặt 4 job dưới đây làm
# "required status checks" (xem RUNBOOK.md § Branch protection). Không có bước
# đó thì CI chỉ báo đỏ chứ không cản merge.
#
# Package manager: pnpm, KHÔNG npm. Lockfile là nguồn sự thật duy nhất
# (`--frozen-lockfile` = cài lệch lockfile thì fail chứ không tự sửa).
# =============================================================================
name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# PR push liên tiếp: huỷ lần chạy cũ, chỉ giữ commit mới nhất.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "11.1.3"

jobs:
  backend-check:
    name: Backend — typecheck, unit test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      # Backend chưa có eslint; `tsc --noEmit` trên cả src lẫn tests là cổng
      # tĩnh tương đương (strict + exactOptionalPropertyTypes đã rất chặt).
      - name: Typecheck (src + tests)
        run: pnpm exec tsc --noEmit -p tsconfig.test.json

      - name: Unit test
        run: pnpm test

      - name: Build
        run: pnpm run build

  backend-integration:
    name: Backend — integration smoke test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      mongodb:
        # App dùng transaction → BẮT BUỘC replica set, mongod đơn lẻ không đủ.
        # `services:` không nhận `--replSet` kèm khởi tạo, nên dùng image
        # bitnami có sẵn cơ chế tự dựng replica set 1 node.
        image: bitnami/mongodb:7.0
        env:
          MONGODB_REPLICA_SET_MODE: primary
          MONGODB_REPLICA_SET_NAME: rs0
          MONGODB_ADVERTISED_HOSTNAME: localhost
          ALLOW_EMPTY_PASSWORD: "yes"
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'rs.status().ok' | grep -q 1"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 20
          --health-start-period 30s
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Integration smoke test (login → department → employee → contract → attendance → payroll)
        run: pnpm run test:integration
        env:
          MONGODB_URI: mongodb://localhost:27017/?replicaSet=rs0&directConnection=true
          AUTH_JWT_SECRET: ci-integration-secret-at-least-32-characters

  frontend-check:
    name: Frontend — lint, typecheck, unit test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Unit test
        run: pnpm test

      # `pnpm run build` đã gồm `tsc --noEmit && vite build`.
      - name: Build
        run: pnpm run build
        env:
          VITE_API_BASE_URL: /api/v1

  docker-build:
    name: Docker — build image backend + frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Chỉ build, không push: mục đích là bắt lỗi Dockerfile/lockfile ngay ở
      # PR thay vì lúc deploy trên VPS.
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          build-args: VITE_API_BASE_URL=/api/v1
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  secret-scan:
    name: Secrets — quét lộ bí mật trong repo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks cần đủ lịch sử để quét cả commit cũ, không chỉ diff.
          fetch-depth: 0

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Chốt hạ tầng: lockfile npm không được quay lại, .env không được commit.
      - name: Cấm package-lock.json và file .env
        run: |
          if git ls-files | grep -E '(^|/)package-lock\.json$|(^|/)yarn\.lock$'; then
            echo "::error::Dự án chỉ dùng pnpm — xoá package-lock.json / yarn.lock"
            exit 1
          fi
          if git ls-files | grep -E '(^|/)\.env$|(^|/)\.env\.(local|staging|production)$'; then
            echo "::error::File .env chứa secret, không được commit. Dùng .env.*.example + secret trên server."
            exit 1
          fi

  # Job tổng hợp: đặt DUY NHẤT job này làm required status check nếu không
  # muốn khai báo từng job một trong branch protection.
  ci-passed:
    name: CI passed
    runs-on: ubuntu-latest
    needs: [backend-check, backend-integration, frontend-check, docker-build, secret-scan]
    if: always()
    steps:
      - name: Fail nếu bất kỳ job nào không thành công
        run: |
          echo "backend-check=${{ needs.backend-check.result }}"
          echo "backend-integration=${{ needs.backend-integration.result }}"
          echo "frontend-check=${{ needs.frontend-check.result }}"
          echo "docker-build=${{ needs.docker-build.result }}"
          echo "secret-scan=${{ needs.secret-scan.result }}"
          [ "${{ needs.backend-check.result }}" = "success" ] \
            && [ "${{ needs.backend-integration.result }}" = "success" ] \
            && [ "${{ needs.frontend-check.result }}" = "success" ] \
            && [ "${{ needs.docker-build.result }}" = "success" ] \
            && [ "${{ needs.secret-scan.result }}" = "success" ]
